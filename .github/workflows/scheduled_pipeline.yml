name: Daily FPL ELT Pipeline

on:
  schedule:
    # Runs at 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch: # Enables manual trigger button in GitHub UI

jobs:
  execute-elt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Main Pipeline
        run: python main.py

      # ----------------------------------------------------------------------
      # 1. STORE DUCKDB DATABASE AS AN ARTIFACT
      # ----------------------------------------------------------------------
      - name: Upload DuckDB Database Artifact
        if: always() # Uploads even if quality checks fail, allowing post-mortem inspection
        uses: actions/upload-artifact@v4
        with:
          name: fpl-duckdb-database
          path: data/fpl.duckdb
          retention-days: 7 # Keeps database downloadable for 7 days

      # ----------------------------------------------------------------------
      # 2. FAILURE ALERT (Slack / Discord / Webhook)
      # ----------------------------------------------------------------------
      - name: Send Slack Failure Notification
        if: ${{ failure() && secrets.SLACK_WEBHOOK_URL != '' }} # Executes ONLY if a previous step fails and webhook is configured
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ *FPL Data Pipeline Failed!*\nCheck GitHub Actions run logs: '${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'"}' \
          "$SLACK_WEBHOOK_URL"